<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3f0fb"/>
      <stop offset="1" stop-color="#c3ddef"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- snowflakes -->
  <g stroke="#7fb3d5" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <path d="M150 110 L190 110 M170 90 L170 130 M156 96 L184 124 M184 96 L156 124"/>
    <path d="M1020 420 L1052 420 M1036 404 L1036 436 M1025 409 L1047 431 M1047 409 L1025 431"/>
    <path d="M860 90 L884 90 M872 78 L872 102 M864 82 L880 98 M880 82 L864 98"/>
  </g>
  <g fill="#a8c8e0">
    <circle cx="120" cy="420" r="7"/>
    <circle cx="950" cy="180" r="6"/>
    <circle cx="640" cy="90" r="5"/>
    <circle cx="1080" cy="300" r="6"/>
  </g>
  <!-- ice cream cone held up -->
  <g>
    <!-- cone -->
    <path d="M430 430 L500 430 L465 560 Z" fill="#d9a06b"/>
    <g stroke="#b57e4b" stroke-width="4" stroke-linecap="round">
      <path d="M440 460 L490 460"/>
      <path d="M448 490 L482 490"/>
      <path d="M456 520 L474 520"/>
      <path d="M448 452 L462 540"/>
      <path d="M482 452 L468 540"/>
    </g>
    <!-- scoops -->
    <circle cx="465" cy="400" r="55" fill="#f4f6f8"/>
    <circle cx="420" cy="415" r="38" fill="#a8d8ea"/>
    <circle cx="510" cy="415" r="38" fill="#a8d8ea"/>
    <circle cx="465" cy="360" r="34" fill="#ffffff"/>
    <!-- cherry -->
    <circle cx="465" cy="322" r="12" fill="#e76f51"/>
    <path d="M465 310 Q480 290 495 292" stroke="#2a7a4b" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- drips -->
    <path d="M420 450 Q420 470 428 462 Q436 452 432 440" fill="#a8d8ea"/>
    <path d="M505 448 Q512 466 504 458 Q496 450 500 438" fill="#a8d8ea"/>
  </g>
  <!-- slushy cup -->
  <g>
    <path d="M700 380 L820 380 L800 560 L720 560 Z" fill="#5aa9c9" opacity="0.9"/>
    <rect x="695" y="365" width="130" height="22" rx="8" fill="#2a7a9e"/>
    <path d="M730 380 L750 300" stroke="#e76f51" stroke-width="12" stroke-linecap="round"/>
    <g fill="#ffffff" opacity="0.7">
      <circle cx="740" cy="430" r="10"/>
      <circle cx="780" cy="470" r="8"/>
      <circle cx="755" cy="510" r="9"/>
    </g>
    <text x="760" y="505" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">slushy</text>
  </g>
  <!-- head with cold chill -->
  <g>
    <!-- head -->
    <path d="M950 200 C1010 180 1060 200 1080 240 C1095 270 1090 310 1070 330 C1055 345 1035 350 1015 345 L1000 355 C985 365 965 360 958 345 L945 320 C930 285 925 225 950 200 Z" fill="#f2c9a0"/>
    <!-- closed eye -->
    <path d="M990 275 Q1010 285 1030 275" stroke="#7a4a21" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- wince brow -->
    <path d="M985 252 Q1010 242 1035 252" stroke="#5b3a1e" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- hand on forehead -->
    <path d="M1000 190 Q1030 160 1075 175 Q1100 185 1095 210 Q1090 230 1065 225 Q1030 215 1010 225 Q995 210 1000 190 Z" fill="#f2c9a0"/>
    <path d="M1030 175 L1035 205 M1050 172 L1055 205 M1070 175 L1072 205" stroke="#d9a06b" stroke-width="4" stroke-linecap="round"/>
    <!-- hair -->
    <path d="M945 210 C965 160 1045 145 1085 185 C1092 192 1095 202 1090 212 C1065 185 1005 172 968 190 C955 196 948 202 945 210 Z" fill="#5b3a1e"/>
  </g>
  <!-- chill waves around head -->
  <g stroke="#2a9d8f" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M900 220 A70 70 0 0 1 900 330"/>
    <path d="M1120 210 A80 80 0 0 1 1120 340"/>
  </g>
  <g font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#1d7a6e">
    <text x="880" y="580">brrr… brain freeze!</text>
  </g>
  <!-- ice cubes -->
  <g fill="#bfe3f2" stroke="#7fb3d5" stroke-width="4">
    <rect x="180" y="500" width="60" height="60" rx="10" transform="rotate(12 210 530)"/>
    <rect x="590" y="540" width="52" height="52" rx="10" transform="rotate(-10 616 566)"/>
  </g>
</svg>
