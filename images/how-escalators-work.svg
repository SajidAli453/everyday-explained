<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf5f4"/>
      <stop offset="1" stop-color="#cfe8e2"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f4ec"/>
      <stop offset="1" stop-color="#d9d2c2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- floor line -->
  <rect x="60" y="540" width="1080" height="8" fill="#0f4c4c" opacity="0.25"/>
  <!-- balustrade glass panel -->
  <polygon points="180,540 1020,180 1020,60 180,420" fill="#ffffff" opacity="0.35"/>
  <polygon points="180,540 1020,180 1020,60 180,420" fill="none" stroke="#0f4c4c" stroke-width="6" opacity="0.5"/>
  <!-- handrail: parallel band above the balustrade -->
  <polyline points="170,420 1010,60" fill="none" stroke="#0f4c4c" stroke-width="26" stroke-linecap="round"/>
  <polyline points="170,420 1010,60" fill="none" stroke="#2a7f7a" stroke-width="14" stroke-linecap="round"/>
  <!-- landing plates -->
  <rect x="120" y="500" width="180" height="40" fill="#8a94a6"/>
  <rect x="900" y="140" width="180" height="40" fill="#8a94a6"/>
  <!-- comb teeth at lower landing -->
  <g stroke="#5b6472" stroke-width="5" stroke-linecap="round">
    <line x1="300" y1="500" x2="330" y2="500"/>
    <line x1="300" y1="510" x2="330" y2="510"/>
    <line x1="300" y1="520" x2="330" y2="520"/>
    <line x1="300" y1="530" x2="330" y2="530"/>
  </g>
  <!-- comb teeth at upper landing -->
  <g stroke="#5b6472" stroke-width="5" stroke-linecap="round">
    <line x1="870" y1="140" x2="900" y2="140"/>
    <line x1="870" y1="150" x2="900" y2="150"/>
    <line x1="870" y1="160" x2="900" y2="160"/>
    <line x1="870" y1="170" x2="900" y2="170"/>
  </g>
  <!-- steps: flat at bottom, stair shape in the middle, flat at top -->
  <g stroke="#0f4c4c" stroke-width="4" stroke-linejoin="round">
    <!-- flat bottom steps -->
    <rect x="330" y="500" width="110" height="40" fill="url(#step)"/>
    <rect x="440" y="500" width="110" height="40" fill="url(#step)"/>
    <!-- rising steps -->
    <polygon points="550,500 660,500 660,440 550,440" fill="url(#step)"/>
    <polygon points="660,440 770,440 770,380 660,380" fill="url(#step)"/>
    <polygon points="770,380 880,380 880,320 770,320" fill="url(#step)"/>
    <!-- flat top steps -->
    <rect x="880" y="320" width="110" height="40" fill="url(#step)"/>
    <rect x="990" y="320" width="110" height="40" fill="url(#step)"/>
  </g>
  <!-- step grooves -->
  <g stroke="#b9b2a2" stroke-width="3">
    <line x1="345" y1="500" x2="345" y2="540"/>
    <line x1="370" y1="500" x2="370" y2="540"/>
    <line x1="395" y1="500" x2="395" y2="540"/>
    <line x1="420" y1="500" x2="420" y2="540"/>
    <line x1="565" y1="440" x2="565" y2="500"/>
    <line x1="595" y1="440" x2="595" y2="500"/>
    <line x1="625" y1="440" x2="625" y2="500"/>
    <line x1="675" y1="380" x2="675" y2="440"/>
    <line x1="705" y1="380" x2="705" y2="440"/>
    <line x1="735" y1="380" x2="735" y2="440"/>
    <line x1="785" y1="320" x2="785" y2="380"/>
    <line x1="815" y1="320" x2="815" y2="380"/>
    <line x1="845" y1="320" x2="845" y2="380"/>
  </g>
  <!-- drive sprocket hint at top -->
  <circle cx="1010" cy="200" r="34" fill="#0f4c4c"/>
  <circle cx="1010" cy="200" r="14" fill="#eaf5f4"/>
  <!-- return loop hint under the steps -->
  <polyline points="330,540 990,180" fill="none" stroke="#0f4c4c" stroke-width="8" stroke-dasharray="18 14" opacity="0.45"/>
  <!-- motion arrows -->
  <g fill="#e8a317">
    <polygon points="420,470 470,470 470,455 505,480 470,505 470,490 420,490"/>
    <polygon points="700,360 750,360 750,345 785,370 750,395 750,380 700,380"/>
  </g>
  <!-- caption strip -->
  <rect x="60" y="560" width="420" height="46" rx="8" fill="#0f4c4c"/>
  <text x="84" y="591" font-family="Georgia, serif" font-size="26" fill="#ffffff">Steps that loop — flat, then stairs</text>
</svg>
